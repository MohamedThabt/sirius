services:
  # LiteLLM Proxy
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./fastAPI/src/configllm.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    networks:
      - sirius-network

  # FastAPI Application
  fastapi:
    build:
      context: ./fastAPI
      dockerfile: Dockerfile
    image: sirius-fastapi:latest
    restart: unless-stopped
    ports:
      - "8005:8005"
    depends_on:
      - litellm-proxy
    networks:
      - sirius-network

  # Laravel Application
  laravel-app:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    image: sirius-laravel:latest
    restart: unless-stopped
    working_dir: /var/www
    expose:
      - 9000
    volumes:
      - laravel-storage:/var/www/storage:rw
      - laravel-public:/var/www/public:rw
      - laravel-bootstrap-cache:/var/www/bootstrap/cache:rw
    networks:
      - sirius-network
    entrypoint: ["/usr/local/bin/php-entrypoint"]
    command: ["php-fpm"]

  # Nginx Web Server for Laravel
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80"
    volumes:
      - ./laravel/.docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - laravel-public:/var/www/public:ro
      - laravel-storage:/var/www/storage:rw
    depends_on:
      - laravel-app
    networks:
      - sirius-network

volumes:
  laravel-storage:
  laravel-public:
  laravel-bootstrap-cache:

networks:
  sirius-network:
    driver: bridge

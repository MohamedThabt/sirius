services:
  # The Laravel Application Container
  prod-app:
    image: ghcr.io/MohamedThabt/sirius-laravel:latest
    restart: unless-stopped
    working_dir: /var/www
    expose:
      - 9000
    volumes:
      - storage:/var/www/storage:rw
      - public_assets:/assets_volume
      - bootstrap-cache:/var/www/bootstrap/cache:rw
    networks:
      - dokploy-network
    env_file:
      - .env
    entrypoint: ["/usr/local/bin/php-entrypoint"]
    command: ["php-fpm"]

  # Nightwatch Monitoring Agent (Official Image)
  nightwatch:
    image: ghcr.io/mohamedthabt/sirius-nightwatch-agent:latest
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: php nightwatch-status
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - dokploy-network
    depends_on:
      - prod-app

  # The Nginx Web Server Container
  prod-nginx:
    image: nginx:alpine
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - ./laravel/.docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - public_assets:/var/www/public:ro
      - storage:/var/www/storage:rw
    depends_on:
      - prod-app
    networks:
      - dokploy-network

volumes:
  storage:
  public_assets:
  bootstrap-cache:

networks:
  dokploy-network:
    external: true

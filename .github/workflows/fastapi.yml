name: Build & Push FastAPI

on:
  push:
    branches: [ "prod" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build -t ghcr.io/mohamedthabt/sirius-fastapi:latest ./fastapi

      - name: Push image
        run: docker push ghcr.io/mohamedthabt/sirius-fastapi:latest

name: Build & Push Laravel

on:
  push:
    branches: [ "prod" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build -t ghcr.io/mohamedthabt/sirius-laravel:latest ./laravel

      - name: Push image
        run: docker push ghcr.io/mohamedthabt/sirius-laravel:latest
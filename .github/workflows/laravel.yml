name: Build and Deploy Laravel

on:
  push:
    branches: [ "prod" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 1. Laravel App Image ---
      - name: Extract metadata (Laravel)
        id: meta-laravel
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/mohamedthabt/sirius-laravel
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Laravel app
        uses: docker/build-push-action@v5
        with:
          context: ./laravel
          push: true
          tags: ${{ steps.meta-laravel.outputs.tags }}
          labels: ${{ steps.meta-laravel.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Deployment Trigger ---
      - name: Trigger Dokploy deployment
        if: success()
        run: |
          curl -X POST ${{ secrets.DOKPLOY_WEBHOOK_URL_LARAVEL }} \
            -H "Content-Type: application/json" \
            -d '{
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "repository": "${{ github.repository }}",
              "pusher": {
                "name": "${{ github.actor }}",
                "email": "${{ github.actor }}@users.noreply.github.com"
              }
            }'
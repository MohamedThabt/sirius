name: Build and Deploy Laravel

on:
  push:
    branches: [ "prod" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 1. Laravel App Image ---
      - name: Extract metadata (Laravel)
        id: meta-laravel
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/mohamedthabt/sirius-laravel
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Laravel app
        uses: docker/build-push-action@v5
        with:
          context: ./laravel
          push: true
          tags: ${{ steps.meta-laravel.outputs.tags }}
          labels: ${{ steps.meta-laravel.outputs.labels }}
          provenance: false
          sbom: false

      # --- Deployment Trigger (After image push) ---
      - name: Trigger Dokploy deployment
        if: success()
        run: |
          curl -X POST "https://1-dokploy.siriusai.tech/api/compose.redeploy" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -d '{"composeId": "KM5938sqJDoSyVeRGax4s"}'

"""
pytest configuration for running tests
"""

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: integration test
    unit: unit test
    asyncio: async test
    slow: slow running test
    smoke: smoke test

# Coverage options
addopts = 
    --strict-markers
    --tb=short
    -ra

# Test output
console_output_style = progress

# Asyncio mode
asyncio_mode = auto

# Timeout
timeout = 300
timeout_method = thread

services:
  # Laravel App (Production - Pulls from GHCR)
  prod-app:
    image: ghcr.io/mohamedthabt/sirius-laravel:latest
    pull_policy: always
    restart: unless-stopped
    working_dir: /var/www
    expose:
      - 9000
    volumes:
      - public_assets:/assets_volume # Target for entrypoint copy script
      - storage:/var/www/storage:rw
    networks:
      - dokploy-network
    env_file:
      - .env

  # Nightwatch Monitoring Agent (Official Image)
  nightwatch:
    image: ghcr.io/mohamedthabt/sirius-nightwatch-agent:latest
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: php nightwatch-status
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - dokploy-network
    depends_on:
      - prod-app

  # Nginx Web Server (Production - Standard Image)
  prod-nginx:
    image: nginx:alpine
    pull_policy: always
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - ./.docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - public_assets:/var/www/public:ro # Read from shared volume
      - storage:/var/www/storage:rw      # Serve storage files
    depends_on:
      - prod-app
    networks:
      - dokploy-network

volumes:
  public_assets:
  storage:

networks:
  dokploy-network:
    external: true

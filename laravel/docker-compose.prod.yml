services:
  # Laravel App (Production - Pulls from GHCR)
  prod-app:
    image: ghcr.io/mohamedthabt/sirius-laravel:latest
    restart: unless-stopped
    working_dir: /var/www
    expose:
      - 9000
    networks:
      - sirius-network
    # Environment variables should be managed via Dokploy UI
    # or by providing a secure .env file on the server

  # Nginx Web Server (Production - Pulls from GHCR)
  prod-nginx:
    image: ghcr.io/mohamedthabt/sirius-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - prod-app
    networks:
      - sirius-network

networks:
  sirius-network:
    driver: bridge

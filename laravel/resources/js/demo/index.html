<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Sirius</title>
        <meta
            name="description"
            content="Sirius turns a project brief into a complete spec: system overview, PRD, modules, features, ERDs, sequence diagrams, C4 architecture and wireframes. Interactive portfolio demo with mock data."
        />
        <meta name="theme-color" content="#0F172A" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Sirius" />
        <meta property="og:title" content="Sirius — AI project planning (demo)" />
        <meta property="og:image" content="/images/seo/image.png" />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="icon" href="/favicon.png" type="image/png" />
        <link rel="apple-touch-icon" href="/favicon.png" />

        <script>
            // Apply the saved or system colour scheme before first paint (mirrors app.blade.php).
            (function () {
                var appearance = 'system';
                try {
                    appearance = localStorage.getItem('appearance') || 'system';
                } catch (e) {}
                var dark = appearance === 'dark' || (appearance === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) document.documentElement.classList.add('dark');
            })();
        </script>
        <style>
            html {
                background-color: oklch(0.9784 0.0011 264.0521);
            }
            html.dark {
                background-color: oklch(0.1553 0.0226 265.3198);
            }
        </style>

        <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    </head>
    <body class="font-sans antialiased">
        <div id="app"></div>
        <script type="module" src="./main.tsx"></script>
    </body>
</html>

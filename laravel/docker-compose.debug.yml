services:
  # Laravel App (Debug - Builds Locally with instrumentation)
  prod-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sirius-laravel:debug
    restart: unless-stopped
    working_dir: /var/www
    expose:
      - 9000
    volumes:
      - public_assets:/assets_volume
      - storage:/var/www/storage:rw
    networks:
      - sirius-network
    environment:
      - APP_ENV=production
      - APP_DEBUG=true
      - APP_URL=https://siriusai.tech
      - LOG_CHANNEL=stderr
      - LOG_LEVEL=debug
      - SESSION_DRIVER=file
      - SESSION_SECURE_COOKIE=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/storage/database.sqlite

  # Nginx Web Server
  prod-nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./.docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - public_assets:/var/www/public:ro
      - storage:/var/www/storage:rw
    depends_on:
      - prod-app
    networks:
      - sirius-network

volumes:
  public_assets:
  storage:

networks:
  sirius-network:
    driver: bridge

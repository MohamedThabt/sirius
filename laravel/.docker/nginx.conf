server {
    listen 80;
    server_name _;
    root /var/www/public;
    
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php index.html;

    access_log /dev/stdout;
    error_log /dev/stderr error;

    charset utf-8;
    
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;
    
    # Handle Laravel storage files
    location /storage/ {
        alias /var/www/storage/app/public/;
        access_log off;
        expires max;
        add_header Cache-Control "public";
    }

    location ~ \.php$ {
        resolver 127.0.0.11 valid=10s;
        set $upstream_app prod-app;
        fastcgi_pass $upstream_app:9000;

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Increase buffer sizes for large headers (Laravel/Inertia)
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 32k;

        # These headers pass information about the original request to PHP-FPM
        fastcgi_param  HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        
        # Pass through the actual X-Forwarded-Proto header from Cloudflare
        fastcgi_param  HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        
        fastcgi_param  HTTP_X_FORWARDED_HOST $host;
        
        # Set the correct port based on protocol
        set $forwarded_port $http_x_forwarded_port;
        if ($http_x_forwarded_proto = "https") {
            set $forwarded_port 443;
        }
        if ($forwarded_port = "") {
            set $forwarded_port $server_port;
        }
        fastcgi_param  HTTP_X_FORWARDED_PORT $forwarded_port;
        
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.ht {
        deny all;
    }
}

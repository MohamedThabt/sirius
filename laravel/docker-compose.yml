services:
  # The Laravel Application Container (Local Development - builds from Dockerfile)
  dev-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www
    expose:
      - 9000
    volumes:
      - .:/var/www
      - /var/www/vendor  # Exclude vendor from bind mount
      - /var/www/node_modules  # Exclude node_modules from bind mount
    networks:
      - dev-network
    env_file:
      - .env

  # The Nginx Web Server Container
  dev-nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./.docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www
    depends_on:
      - dev-app
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

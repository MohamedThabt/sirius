        <script>
            // Apply the saved or system colour scheme before first paint (mirrors app.blade.php).
            (function () {
                var appearance = 'system';
                try {
                    appearance = localStorage.getItem('appearance') || 'system';
                } catch (e) {}
                // Marketing pages (landing, architecture, pricing, team) are always dark.
                var marketing = /^\/(architecture|pricing|team)?\/?$/.test(location.pathname);
                var dark = marketing || appearance === 'dark' || (appearance === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) document.documentElement.classList.add('dark');
            })();
        </script>
        <style>
            html {
                background-color: #f5f5f5;
            }
            html.dark {
                background-color: #0f0f0f;
